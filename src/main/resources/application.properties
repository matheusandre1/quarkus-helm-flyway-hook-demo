quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=demo
quarkus.datasource.password=demo
quarkus.datasource.jdbc.url=jdbc:postgresql://postgresql:5432/demo

# The image is built into the Minikube Docker daemon, so it must not be pulled
quarkus.container-image.registry=
quarkus.container-image.group=demo
quarkus.kubernetes.image-pull-policy=IfNotPresent

# The fix for https://github.com/quarkiverse/quarkus-helm/issues/451
quarkus.helm.init-task-hook.enabled=true

# The Flyway migrations are executed by the init task Job
quarkus.flyway.migrate-at-start=true

# Otherwise, the Deployment selector changes on every version, and it's immutable too
quarkus.kubernetes.add-version-to-label-selectors=false
